<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IndiChat</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- LOGIN / REGISTER SCREEN -->
  <div id="login-screen" class="screen">
    <div class="login-card">
      <div class="tricolor-bar"></div>
      <h1>IndiChat</h1>
      <p class="tagline">Simple, fast, real-time messaging</p>

      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Log in</button>
        <button class="auth-tab" data-tab="register">Sign up</button>
      </div>

      <form id="login-form" class="auth-form">
        <input type="tel" id="login-phone" placeholder="Phone number" required />
        <input type="password" id="login-password" placeholder="Password" required />
        <button type="submit">Log in</button>
      </form>

      <form id="register-form" class="auth-form hidden">
        <input type="text" id="register-name" placeholder="Your name" required />
        <input type="tel" id="register-phone" placeholder="Phone number" required />
        <input type="password" id="register-password" placeholder="Password (min 6 characters)" required minlength="6" />
        <button type="submit">Sign up</button>
      </form>

      <p id="auth-error" class="auth-error hidden"></p>
    </div>
  </div>

  <!-- CHAT APP SCREEN -->
  <div id="app-screen" class="screen hidden">
    <div class="app-container">

      <!-- Sidebar -->
      <div class="sidebar">
        <div class="sidebar-header">
          <div class="my-profile" id="my-profile" title="View profile">
            <div id="my-avatar" class="header-avatar"></div>
            <div class="my-name" id="my-name"></div>
          </div>
          <div class="sidebar-header-actions">
            <button id="add-contact-btn" class="new-group-btn" title="Add contact">+ Contact</button>
            <button id="new-group-btn" class="new-group-btn" title="New group">+ Group</button>
          </div>
        </div>
        <div class="contact-list" id="contact-list"></div>
      </div>

      <!-- Chat window -->
      <div class="chat-panel">
        <div id="chat-empty" class="chat-empty">
          Select a chat to start messaging
        </div>

        <div id="chat-active" class="chat-active hidden">
          <div class="chat-header">
            <button id="back-btn" class="back-btn" title="Back">←</button>
            <div id="chat-header-avatar"></div>
            <div class="chat-header-info">
              <div class="chat-contact-name" id="chat-contact-name"></div>
              <div class="chat-contact-status" id="chat-contact-status"></div>
            </div>
            <button id="delete-chat-btn" class="icon-btn header-icon-btn" title="Delete chat">🗑</button>
          </div>

          <div class="messages" id="messages"></div>

          <div class="typing-indicator hidden" id="typing-indicator">typing…</div>

          <div id="upload-preview" class="upload-preview hidden">
            <div id="upload-preview-content" class="upload-preview-content"></div>
            <div class="upload-preview-actions">
              <button type="button" id="upload-cancel-btn" class="btn-secondary">Cancel</button>
              <button type="button" id="upload-send-btn" class="btn-primary">Send</button>
            </div>
          </div>

          <form id="message-form" class="message-form">
            <input type="file" id="file-input" hidden />
            <button type="button" id="attach-btn" class="icon-btn" title="Attach file">📎</button>
            <button type="button" id="mic-btn" class="icon-btn" title="Record voice note">🎤</button>
            <input type="text" id="message-input" placeholder="Type a message" autocomplete="off" />
            <button type="submit">Send</button>
          </form>
        </div>
      </div>

    </div>
  </div>

  <!-- PROFILE MODAL -->
  <div id="profile-modal" class="modal-overlay hidden">
    <div class="modal">
      <h3>Profile</h3>

      <div class="profile-avatar-section">
        <div id="profile-avatar-preview"></div>
        <input type="file" id="avatar-file-input" accept="image/*" hidden />
        <button type="button" id="change-avatar-btn" class="btn-secondary">Change photo</button>
      </div>

      <label class="modal-label">Name</label>
      <input type="text" id="profile-name-input" />
      <label class="modal-label">Phone number</label>
      <input type="tel" id="profile-phone-input" />
      <p id="profile-error" class="auth-error hidden"></p>
      <p id="profile-success" class="profile-success hidden"></p>
      <div class="modal-actions">
        <button id="profile-save-btn" class="btn-primary">Save changes</button>
      </div>

      <hr class="modal-divider" />

      <h3>Change password</h3>
      <input type="password" id="profile-current-password" placeholder="Current password" />
      <input type="password" id="profile-new-password" placeholder="New password (min 6 characters)" />
      <p id="password-error" class="auth-error hidden"></p>
      <p id="password-success" class="profile-success hidden"></p>
      <div class="modal-actions">
        <button id="password-change-btn" class="btn-primary">Change password</button>
      </div>

      <hr class="modal-divider" />

      <div class="modal-actions">
        <button id="profile-close-btn" class="btn-secondary">Close</button>
        <button id="logout-btn" class="btn-secondary">Log out</button>
      </div>
    </div>
  </div>

  <!-- ADD CONTACT MODAL -->
  <div id="contact-modal" class="modal-overlay hidden">
    <div class="modal">
      <h3>Add contact</h3>
      <input type="tel" id="contact-phone-input" placeholder="Their phone number" />
      <p id="contact-add-error" class="auth-error hidden"></p>
      <div class="modal-actions">
        <button id="contact-cancel-btn" class="btn-secondary">Cancel</button>
        <button id="contact-add-btn" class="btn-primary">Add</button>
      </div>
    </div>
  </div>

  <!-- NEW GROUP MODAL -->
  <div id="group-modal" class="modal-overlay hidden">
    <div class="modal">
      <h3>New group</h3>
      <input type="text" id="group-name-input" placeholder="Group name" />
      <div id="group-member-list" class="group-member-list"></div>
      <div class="modal-actions">
        <button id="group-cancel-btn" class="btn-secondary">Cancel</button>
        <button id="group-create-btn" class="btn-primary">Create</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
